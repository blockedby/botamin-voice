- id: T10
  wave: 1
  priority: P0
  owner: A1
  title: Browser audio capture, transport and playback
  depends_on:
  - T00
  owned_paths:
  - apps/web/src/audio
  - apps/web/src/transport
  - apps/web/src/state/voice*
  outputs:
  - AudioWorklet capture and 16 kHz mono PCM16 output
  - 100 ms binary WS frames with bounded browser buffering and a gateway-facing chunk/commit contract
  - explicit end-of-turn audio.commit that closes one bounded utterance for phrase-level STT
  - UI listening/processing semantics followed only by transcript.final
  - provider-neutral playback queue for complete audio/mpeg phrase segments
  - generation cancellation, queue clearing, stale-segment rejection and reconnect
  acceptance:
  - deterministic audio fixture produces expected frame sizes
  - utterance duration and byte limits stop unbounded microphone buffering before audio.commit
  - audio.commit creates exactly one final-transcription request and duplicate commit is suppressed
  - UI renders exactly one current transcript.final for each accepted utterance
  - complete MP3 phrase segments decode and play in sequence in Chromium and WebKit
  - old-generation audio stops and queued segments are dropped after interruption
  - no OpenRouter or Codex secret exists in the bundle
  - browser never calls OpenRouter directly
- id: T11
  wave: 1
  priority: P0
  owner: A2
  title: OpenRouter phrase-level STT adapter in TypeScript/Bun
  depends_on:
  - T00
  owned_paths:
  - apps/server/src/providers/openrouter/stt/**
  - scripts/openrouter-stt*
  outputs:
  - provider-neutral OpenRouterSttAdapter behind atomic final-transcription SttPort
  - native Bun fetch to /api/v1/chat/completions with base64 WAV input_audio
  - configurable audio-input-capable model and Russian transcription instruction
  - validation and request bounds for gateway-produced already-WAV audio/wav bytes, with raw PCM and malformed WAV rejection
  - unchanged-byte base64 encoding with no PCM-to-WAV conversion in the adapter
  - connect and total timeouts, at most one bounded retry, abort and stale-turn suppression
  - one final transcript result
  - typed 400, 401, 402, 404, 413, 429 and 5xx errors without key, audio or PII logs
  - protocol-faithful fake endpoint and paid external Russian smoke command
  acceptance:
  - native fetch posts base64 of the unchanged gateway-produced WAV input_audio request to /api/v1/chat/completions after audio.commit
  - OPENROUTER_STT_MODEL selects a currently audio-input-capable model without shared-contract changes
  - adapter rejects raw PCM, malformed or incompatible WAV, content-type mismatch and over-limit atomic requests before fetch
  - adapter contains no PCM-to-WAV encoder
  - request byte/duration, connect-timeout and total-timeout limits are enforced before or during the request
  - only one final transcript result is emitted
  - abort or obsolete turn emits no transcript and releases bounded buffers
  - 400, 401, 402, 404, 413, 429 and retryable 5xx cases map to bounded typed failures
  - retry repeats only pure transcription and never invokes Luna, business tools or notifier side effects
  - fake endpoint covers success, malformed response, timeout, abort, stale turn and retry behavior without credentials
  - API key, WAV/base64 audio and transcript PII are absent from ordinary logs and browser artifacts
  - opt-in paid external smoke transcribes a Russian fixture; it is excluded from default CI
- id: T12
  wave: 1
  priority: P0

version: 1
project: botamin-voice-agent
spec_version: 0.5-demo
date: '2026-07-31'
invariants:
- booking.created precedes every qualification question and update
- qualification failure or disconnect never cancels an existing booking
- create_booking is idempotent per conversation
- provider credentials never reach the browser
- the assistant never claims a real calendar event was created
- prompts live in Markdown and no online editor is built
- OpenRouter is the only STT and TTS gateway; phrase-level STT returns one final transcript and Codex subscription with gpt-5.6-luna
  provides the brain

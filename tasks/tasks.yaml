  depends_on:
  - T00
  owned_paths:
  - apps/server/src/providers/codex
  - packages/codex-schemas
  - scripts/codex*
  outputs:
  - bounded transport spike comparing official @openai/codex-sdk with direct app-server on Bun
  - BrainPort implementation using direct JSONL JSON-RPC over stdio unless every mandatory SDK control passes
  - process supervisor and request routing
  - auth/model readiness checks
  - isolated AGENTS.md prompt bundle and instructionSources verification
  - thread, turn, delta and addressable interrupt support
  - dynamic tool mode and envelope fallback
  - generated version-pinned schemas and transport ADR evidence
  acceptance:
  - transport decision is supported by reproducible Bun test evidence
  - model/list confirms gpt-5.6-luna
  - thread/start confirms the expected compiled AGENTS.md instruction source
  - streamed text delta arrives from a real test turn
  - turn/interrupt completes as interrupted and late deltas are identifiable
  - app is unready when subscription auth is absent
  - shell/network attempts are blocked
  - protocol drift fails contract tests, not production silently
  - no provider-specific type escapes BrainPort
